name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK for Release
        run: |
          mkdir -p dist-apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk dist-apk/LokSync.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-apk/LokSync.apk
          name: "LokSync ${{ github.ref_name }}"
          body: |
            ### 📱 LokSync Android Companion App
            
            Direct APK download for Android phones. No Google Play Store required.
            
            #### 📥 Download:
            - **[LokSync.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/LokSync.apk)**
            
            #### 🚀 Installation Instructions:
            1. Download `LokSync.apk` onto your Android phone.
            2. Tap the downloaded file to install (allow "Install from Unknown Sources" if prompted).
            3. Open the app while connected to the same Wi-Fi as your Linux laptop.
            4. Tap **Connect**!
          draft: false
          prerelease: false

      - name: Upload Artifact (for manual workflow runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: LokSync-APK
          path: dist-apk/LokSync.apk
