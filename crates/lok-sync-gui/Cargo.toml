[package]
name = "lok-sync-gui"
version = "0.1.0"
edition = "2021"
description = "LokSync modern GUI & CLI client"

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
lok-proto = { path = "../lok-proto" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "macros", "time"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ksni = "0.2"
qrcode = { version = "0.14", default-features = false }
thiserror = "1"
tauri = { version = "2", default-features = false, features = ["wry", "custom-protocol"] }
