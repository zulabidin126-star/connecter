[package]
name = "lok-sync-cli"
version = "0.1.0"
edition = "2021"
description = "LokSync dedicated terminal CLI tool"

[[bin]]
name = "lok-sync"
path = "src/main.rs"

[dependencies]
lok-proto = { path = "../lok-proto" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "macros", "time"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
qrcode = { version = "0.14", default-features = false }
