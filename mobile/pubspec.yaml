name: lok_sync_mobile
description: "LokSync mobile companion app for seamless Linux desktop bridge"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  file_picker: ^8.0.0
  share_plus: ^9.0.0
  battery_plus: ^6.0.0
  crypto: ^3.0.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
